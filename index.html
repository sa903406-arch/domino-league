<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>دوري الدومنة الملكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D14;--panel:#121826;--panel2:#0D121C;--line:#1F2A3D;--text:#F4F6FA;--soft:#C9D1DE;--muted:#8B95A7;--lime:#C6FF3D;--coral:#FF6B7A;--chip:#1B2740;--num:'Barlow Condensed',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;padding:16px 16px 24px}
.n{font-family:var(--num);font-weight:800;direction:ltr;display:inline-block}
.pos{color:var(--lime)}.neg{color:var(--coral)}
.hidden{display:none!important}

/* app bar */
.appbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--lime);color:#0A0D14;display:grid;place-items:center}
.brand b{display:block;font-weight:900;font-size:18px;line-height:1.1}
.brand small{display:block;font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px}
.chip{padding:7px 12px;border-radius:8px;background:var(--chip);font-weight:800;font-size:13px;border:0}
.chip.mode{background:rgba(198,255,61,.14);color:var(--lime)}
.icon{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center}
.icon:active{background:var(--panel)}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:12px;background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.35);color:#FFC2C8;font-weight:700;font-size:13px;line-height:1.6}

/* headings */
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{background:var(--lime);color:#0A0D14;padding:3px 10px;border-radius:4px;font-weight:900;font-size:12px}
.sub{font-weight:500;font-size:13px;color:var(--muted)}
h1{margin:0 0 4px;font-weight:900;font-size:40px;line-height:1.05}
h2{margin:0;font-weight:900;font-size:18px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.hint{font-weight:500;font-size:12px;color:var(--muted);line-height:1.7}
.date{font-weight:500;font-size:15px;color:var(--soft)}

/* controls */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:12px 0 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;color:var(--soft)}
.pill[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#0A0D14;font-weight:900}
.btn{min-height:52px;border:0;border-radius:14px;font-weight:900;font-size:16px;padding:0 18px;width:100%}
.btn.primary{background:var(--lime);color:#0A0D14}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,122,.12);color:var(--coral);border:1px solid rgba(255,107,122,.4)}
.btn.dash{background:transparent;border:2px dashed #34415C;color:var(--lime);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.field{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font-size:16px;font-weight:700}
.field:focus,.btn:focus-visible,.pill:focus-visible,.icon:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* avatar */
.av{--s:36px;position:relative;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:var(--chip);overflow:hidden;vertical-align:middle}
.av::before{content:"";position:absolute;left:50%;top:20%;width:38%;height:38%;margin-left:-19%;border-radius:50%;background:#8B95A7}
.av::after{content:"";position:absolute;left:50%;top:64%;width:70%;height:70%;margin-left:-35%;border-radius:50%;background:#8B95A7}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:var(--chip)}
.pair{display:inline-flex;flex:none}
.pair .av{box-shadow:0 0 0 2px var(--panel)}
.pair .av+.av{margin-inline-start:-10px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;text-align:inherit}
button.row{font:inherit}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:800;font-size:17px}
.row .meta{font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.rank{width:28px;text-align:center;font-family:var(--num);font-weight:800;font-size:26px;color:var(--muted);direction:ltr}
.net{font-family:var(--num);font-weight:800;font-size:32px;direction:ltr}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px}
.bar>i{display:block;height:4px;border-radius:2px;background:var(--lime)}
.bar>i.low{background:var(--coral)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{padding:22px;border:2px dashed #34415C;border-radius:14px;text-align:center;color:var(--muted);font-weight:700;font-size:14px;line-height:1.8}
.tagsm{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:900;font-size:11px;background:var(--lime);color:#0A0D14;margin-inline-start:8px;vertical-align:middle}
.tagsm.bad{background:var(--coral)}

/* leader */
.leader{display:flex;align-items:stretch;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#17233D,#0F1626);border:1px solid #24324D;margin-top:14px;width:100%;text-align:inherit}
.leader::before{content:"";width:6px;background:var(--lime);flex:none}
.leader .in{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 16px}
.leader .pl{display:flex;align-items:center;gap:10px;margin-top:6px}
.leader .nm{font-weight:900;font-size:32px;line-height:1.1}
.leader .big{font-family:var(--num);font-weight:800;font-size:72px;line-height:1;direction:ltr;color:var(--lime);text-align:center}
.crown{display:flex;align-items:center;gap:8px}
.crown .n{font-size:44px;color:var(--lime);line-height:1}
.crown span.t{background:rgba(198,255,61,.14);color:var(--lime);padding:3px 10px;border-radius:4px;font-weight:800;font-size:12px}

/* scorebug match card */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 6px;height:44px;border-bottom:1px solid var(--line);padding-inline-start:14px}
.mhead span.t{font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.side{display:flex;align-items:center;gap:12px;padding:12px 14px;border-inline-start:4px solid transparent}
.side.win{background:rgba(198,255,61,.08);border-inline-start-color:var(--lime)}
.side .who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.side .names{font-weight:700;font-size:17px;color:var(--soft)}
.side.win .names{font-weight:800;color:var(--text)}
.side .score{font-size:36px;line-height:1;color:var(--muted);min-width:44px;text-align:center}
.side.win .score{color:var(--lime)}

/* table */
.tbl{overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.tr{display:grid;grid-template-columns:1fr 52px 52px 62px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.tr.h{background:var(--panel2);border-top:0;font-weight:700;font-size:12px;color:var(--muted)}
.tr .c{text-align:center}
.tr .nm{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.tr .n{font-size:22px}
.check{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);background:rgba(198,255,61,.06)}
.check .ok{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lime);color:#0A0D14;display:grid;place-items:center}

/* chips attendees */
.att{display:flex;flex-wrap:wrap;gap:8px}
.attb{display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 14px 5px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px}
.attb[aria-pressed="true"]{border-color:var(--lime);background:rgba(198,255,61,.1)}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#17233D,#0F1626);border:1px solid #24324D}
.hero .top{display:flex;align-items:center;gap:16px}
.hero .top .av{--s:84px;box-shadow:0 0 0 3px var(--lime)}
.hero .nm{font-weight:900;font-size:42px;line-height:1}
.tiles{display:flex;gap:10px}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.tile .n{font-size:44px;line-height:1}
.tile span.l{font-weight:700;font-size:12px;color:var(--muted)}
.tile.hl{background:rgba(198,255,61,.08);border-color:rgba(198,255,61,.3)}
.wr{display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--soft);margin-bottom:6px}
.wr+.bar{height:6px;margin:0}.wr+.bar>i{height:6px}

/* highlights duos */
.hl2{display:flex;gap:10px}
.hlc{flex:1;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;border:1px solid #24324D;background:linear-gradient(135deg,#17233D,#0F1626);border-top:4px solid var(--lime)}
.hlc.bad{background:linear-gradient(135deg,#2A1A24,#140F18);border-color:#3A2430;border-top-color:var(--coral)}
.hlc .lab{align-self:flex-start;background:var(--lime);color:#0A0D14;padding:2px 8px;border-radius:4px;font-weight:900;font-size:11px}
.hlc.bad .lab{background:var(--coral)}
.hlc .nm{font-weight:800;font-size:17px;line-height:1.3}
.hlc .big{font-family:var(--num);font-weight:800;font-size:46px;line-height:1;direction:ltr;color:var(--lime)}
.hlc.bad .big{color:var(--coral)}
.hlc .pair .av{box-shadow:0 0 0 2px #17233D}

/* log item */
.log{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-inline-start:4px solid var(--lime);border-radius:14px;background:rgba(198,255,61,.08)}
.log.lost{border-inline-start-color:var(--coral);background:rgba(255,107,122,.08)}
.log .grow{flex:1}
.log .s{font-family:var(--num);font-weight:800;font-size:30px;line-height:1;direction:ltr}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel2);border-top:1px solid var(--line);padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:480px;margin:0 auto;display:flex;gap:4px}
.nav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;color:var(--muted);font-weight:700;font-size:12px}
.nav a[aria-current="page"]{background:rgba(198,255,61,.1);color:var(--lime);font-weight:800}

/* sheet + toast */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet .body{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid #24324D}
.sheet h2{margin-bottom:14px}
.lbl{font-weight:800;font-size:13px;color:var(--soft);margin:14px 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.stepper button{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:28px;font-weight:800;color:var(--lime)}
.stepper output{font-family:var(--num);font-weight:800;font-size:56px;min-width:70px;text-align:center;direction:ltr}
.team{padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:12px;background:var(--panel2)}
.vs{text-align:center;font-family:var(--num);font-weight:800;color:var(--muted);margin-top:12px;letter-spacing:.2em}
.acts{display:flex;gap:10px;margin-top:18px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--lime);color:#0A0D14;font-weight:900}
.group{padding:14px 0;border-top:1px solid var(--line)}
.champ{text-align:center;padding:8px 0}
.champ .av{--s:110px;box-shadow:0 0 0 4px var(--lime),0 0 40px rgba(198,255,61,.4);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--lime),0 0 70px rgba(198,255,61,.7)}}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#0D1830;border:1px solid var(--lime);color:var(--lime);padding:12px 20px;border-radius:14px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--coral);color:var(--coral)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-weight:700}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:22px 0 6px;direction:ltr}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;background:none;border:0;padding:0;color:inherit;direction:rtl}
.pod .who{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:0 2px}
.pod .crownI{color:var(--lime);height:26px;display:grid;place-items:end center;filter:drop-shadow(0 0 10px rgba(198,255,61,.6))}
.pod .av{--s:76px;box-shadow:0 0 0 3px var(--ring,#C9D1DE)}
.pod.p1 .av{--s:104px;box-shadow:0 0 0 4px var(--lime),0 0 44px rgba(198,255,61,.35);animation:glow 2.4s ease-in-out infinite}
.pod .nm{font-weight:900;font-size:17px;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1 .nm{font-size:21px}
.pod .st{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.pod .block{width:100%;margin-top:10px;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding-top:10px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--cb);border-bottom:0}
.pod .block .rk{font-family:var(--num);font-weight:800;font-size:46px;line-height:1;color:var(--rc)}
.pod .block .nt{font-family:var(--num);font-weight:800;font-size:26px;line-height:1;direction:ltr}
.pod.p1{--ring:var(--lime);--c1:#22331A;--c2:#121C12;--cb:rgba(198,255,61,.45);--rc:var(--lime)}
.pod.p1 .block{height:150px}
.pod.p2{--ring:#C9D1DE;--c1:#1E2A42;--c2:#111827;--cb:#2C3C5C;--rc:#C9D1DE}
.pod.p2 .block{height:112px}
.pod.p3{--ring:#E0A15A;--c1:#2B2230;--c2:#15121C;--cb:#3E3040;--rc:#E0A15A}
.pod.p3 .block{height:88px}
.floor{height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);opacity:.5;margin-bottom:22px}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--lime),0 0 70px rgba(198,255,61,.55)}}
.row.sm{padding:10px 12px}.row.sm .name{font-size:16px}

/* stats */
.kpis{display:flex;gap:8px;margin-top:14px}
.kpi{flex:1;padding:12px 6px;text-align:center;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.kpi .n{font-size:36px;line-height:1;color:var(--lime)}.kpi span.l{display:block;font-weight:700;font-size:12px;color:var(--muted);margin-top:2px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;text-align:inherit;width:100%}
.aw .lab{font-weight:800;font-size:12px;color:var(--muted)}
.aw .who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;min-width:0}
.aw .v{font-family:var(--num);font-weight:800;font-size:34px;line-height:1;direction:ltr;color:var(--lime)}
.aw .v small{font-size:14px;color:var(--muted);font-weight:700;margin-inline-start:6px}

/* draw */
.board{margin-top:14px;display:flex;flex-direction:column;gap:0}
.tcard{padding:18px 14px;border-radius:18px;background:linear-gradient(135deg,#17233D,#0F1626);border:1px solid #24324D;display:flex;align-items:center;gap:14px}
.tcard.b{background:linear-gradient(135deg,#2A1D2B,#140F18);border-color:#3A2A3C}
.tcard .pair .av{--s:62px;box-shadow:0 0 0 3px #17233D}
.tcard.b .pair .av{box-shadow:0 0 0 3px #1A1220}
.tcard .tn{font-weight:900;font-size:22px;line-height:1.25}
.tcard .tl{font-weight:800;font-size:12px;color:var(--lime);letter-spacing:.04em}
.tcard.b .tl{color:var(--coral)}
.vsb{align-self:center;margin:-10px 0;z-index:2;width:46px;height:46px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:18px;color:var(--soft)}
.slotline{display:flex;align-items:center;gap:10px;min-height:46px}
.slot{display:inline-block;min-width:110px;transition:.2s}
.spinning .tn .slot{color:var(--muted);filter:blur(1.2px)}
.lockpop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:.2}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.restbar{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px dashed #34415C;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--soft);font-weight:700;font-size:14px}
.rnd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.rnd .grow{flex:1;min-width:0}.rnd .t{font-weight:800;font-size:15px}.rnd .m{font-size:12px;color:var(--muted);margin-top:2px}
.rnd.done{border-inline-start:4px solid var(--lime)}
.bigdraw{min-height:68px;font-size:20px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.bigdraw:disabled{opacity:.45}

/* admin */
.hero-a{display:flex;align-items:center;gap:10px}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll button{flex:1 0 auto;padding:0 14px;white-space:nowrap}
.pform .field{margin-bottom:10px}
.prev{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.prev .av{--s:84px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:14px}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.stat{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.stat+.stat{margin-top:8px}.stat .d{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.stat.ok .d{background:var(--lime)}.stat.bad .d{background:var(--coral)}.stat .grow{flex:1}

<script type="module">
/* =====================================================================
   دوري الدومنة الملكي — النسخة التجريبية v2
   - المباراة = ثنائي ضد ثنائي. كل الإحصائيات تُحسب من المواجهات.
   - الموسم 1 = بياناتك القديمة (فوز/خسارة لكل لاعب) كأرشيف.
   - وضعان: "تجريبي" (على هذا الجهاز فقط) و"مباشر" (Firebase، مجموعات v2_ فقط).
   ===================================================================== */
const FB_DEFAULT={apiKey:"AIzaSyDJS8QCZRfa72Vl8NZxFZcLY-ee0CFILzw",authDomain:"koster-499c0.firebaseapp.com",projectId:"koster-499c0",storageBucket:"koster-499c0.firebasestorage.app",messagingSenderId:"170205849470",appId:"1:170205849470:web:7133888e3051c7ab47b52f"};
const FB=(()=>{const o=(()=>{try{return JSON.parse(localStorage.getItem('dl2_fbcfg')||'null')}catch{return null}})();return o&&o.projectId&&o.apiKey?o:FB_DEFAULT})();
const CROWN='<svg width="26" height="22" viewBox="0 0 26 22" fill="currentColor" aria-hidden="true"><path d="M2 7l5.5 5L13 2l5.5 10L24 7l-2 12H4z"/></svg>';
const MIN_GAMES=3;                // أقل عدد كيمات لاعتماد شريك/خصم/ثنائي في الألقاب

/* ---------- أدوات ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const dobj=s=>new Date(s+'T12:00:00');
const fmtLong=s=>dobj(s).toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const weekday=s=>dobj(s).toLocaleDateString('ar-u-nu-latn',{weekday:'long'});
const fmtShort=s=>dobj(s).toLocaleDateString('ar-u-nu-latn',{weekday:'short',day:'numeric',month:'short'});
const signed=n=>n>0?'+'+n:String(n);
const pc=(w,l)=>w+l?Math.round(w/(w+l)*100):0;
const kimTxt=n=>n===1?'كَيم واحد':n===2?'كَيمان':n<=10?n+' كَيمات':n+' كَيماً';
const matchTxt=n=>n===1?'مواجهة واحدة':n===2?'مواجهتان':n<=10?n+' مواجهات':n+' مواجهة';
const nightTxt=n=>n===1?'ليلة واحدة':n===2?'ليلتان':n<=10?n+' ليالٍ':n+' ليلة';
const svg=(d,w=22,sw=2)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={edit:svg('<path d="M4 20h4l11-11-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',18),trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',18),plus:svg('<path d="M12 5v14M5 12h14"/>',20,2.4),check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>',18,3),back:svg('<path d="M9 5l7 7-7 7"/>',20,2.2)};

/* ---------- الحالة ---------- */
const S={
  mode:LS.get('dl2_mode',/^https?:/.test(location.protocol)?'live':'demo'),
  players:[],            // [{name,img}]
  nights:[],             // [{id,date,season,players:[],matches:[{a:[],b:[],sa,sb}]}]
  legacy:[],             // الموسم 1: [{name,date,win,loss}]
  meta:{currentSeason:2,champions:[]},
  page:'standings',viewSeason:null,viewPlayer:null,backTo:'standings',adminTab:'record',unlocked:false,diag:null,
  draw:LS.get('dl2_draw_'+LS.get('dl2_mode',/^https?:/.test(location.protocol)?'live':'demo'),{rounds:[],busy:false,pending:null}),
  draft:null,error:'',ready:false
};
let SH=null;             // حالة النافذة السفلية
let fb=null,unsubs=[];

/* ---------- بيانات تجريبية ---------- */
const NAMES=['سعيد','إبراهيم','سيروان','أحمد','حسن','علي'];
function demoSeed(){
  const L=(date,rows)=>rows.map(([name,win,loss])=>({name,date,win,loss}));
  return{
    players:NAMES.map(name=>({name,img:''})),
    legacy:[...L('2026-10-20',[['سعيد',6,4],['إبراهيم',8,3],['سيروان',2,7],['أحمد',6,8]]),
            ...L('2026-10-27',[['سعيد',4,5],['إبراهيم',9,2],['حسن',5,6],['علي',4,9]]),
            ...L('2026-11-03',[['سعيد',7,3],['أحمد',4,6],['علي',5,4],['حسن',2,5]])],
    nights:[{id:'demo1',date:daysAgo(7),season:2,players:[...NAMES],matches:[
      {a:['سعيد','إبراهيم'],b:['أحمد','سيروان'],sa:4,sb:1},
      {a:['إبراهيم','حسن'],b:['سيروان','علي'],sa:2,sb:0},
      {a:['أحمد','علي'],b:['سعيد','حسن'],sa:2,sb:1},
      {a:['إبراهيم','علي'],b:['حسن','أحمد'],sa:7,sb:3}]}],
    meta:{currentSeason:2,champions:[]}
  };
}
function loadDemo(){
  let d=LS.get('dl2_demo',null);
  if(!d||!d.players){d=demoSeed();LS.set('dl2_demo',d)}
  S.players=d.players;S.legacy=d.legacy||[];S.nights=d.nights||[];S.meta={currentSeason:2,champions:[],...d.meta};
  sortNights();
}
function persistDemo(){LS.set('dl2_demo',{players:S.players,legacy:S.legacy,nights:S.nights,meta:S.meta})}
const sortNights=()=>S.nights.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.id).localeCompare(String(b.id)));

/* ---------- Firebase (الوضع المباشر) ---------- */
async function fbInit(){
  if(fb)return fb;
  const [A,F]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js')]);
  const app=A.initializeApp(FB,'dl2');
  fb={fs:F,db:F.getFirestore(app)};return fb;
}
const withTimeout=(p,ms=9000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('انتهت مهلة الاتصال')),ms))]);
async function loadLive(){
  const {fs,db}=await fbInit();
  const [ps,gr,mt]=await withTimeout(Promise.all([fs.getDocs(fs.collection(db,'players')),fs.getDocs(fs.collection(db,'game_records')),fs.getDoc(fs.doc(db,'v2_meta','state'))]));
  S.players=ps.docs.map(d=>({id:d.id,name:d.data().name,img:d.data().imageUrl||''})).filter(p=>p.name).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  S.legacy=gr.docs.map(d=>{const r=d.data();return{name:r.name,date:r.date,win:+r.win||0,loss:+r.loss||0}}).filter(r=>r.name&&r.date);
  if(mt.exists())S.meta={currentSeason:2,champions:[],...mt.data()};
  const first=new Promise((res,rej)=>{
    let done=false;
    unsubs.push(fs.onSnapshot(fs.collection(db,'v2_nights'),snap=>{
      S.nights=snap.docs.map(d=>({id:d.id,...d.data()}));sortNights();
      if(!done){done=true;res()}else render();
    },err=>{if(!done){done=true;rej(err)}else toast('خطأ في المزامنة: '+err.code,true)}));
    unsubs.push(fs.onSnapshot(fs.doc(db,'v2_meta','state'),snap=>{if(snap.exists()){S.meta={currentSeason:2,champions:[],...snap.data()};render()}}));
  });
  await withTimeout(first);
}

/* ---------- طبقة الحفظ ---------- */
const Data={
  async saveNight(n){
    const clean=clone({date:n.date,season:seasonOf(n.date),players:n.players,matches:n.matches});
    if(S.mode==='demo'){
      const id=n.id||('n'+Date.now());const night={...clean,id};
      const i=S.nights.findIndex(x=>x.id===id);
      if(i>=0)S.nights[i]=night;else S.nights.push(night);
      sortNights();persistDemo();return id;
    }
    const {fs,db}=await fbInit();clean.updatedAt=new Date().toISOString();
    if(n.id){await withTimeout(fs.setDoc(fs.doc(db,'v2_nights',n.id),clean));return n.id}
    const r=await withTimeout(fs.addDoc(fs.collection(db,'v2_nights'),clean));return r.id;
  },
  async deleteNight(id){
    if(S.mode==='demo'){S.nights=S.nights.filter(n=>n.id!==id);persistDemo();return}
    const {fs,db}=await fbInit();await withTimeout(fs.deleteDoc(fs.doc(db,'v2_nights',id)));
  },
  async savePlayer(p){
    const rec={name:p.name,img:p.img||''};
    if(S.mode==='demo'){
      const i=S.players.findIndex(x=>x.name===p.name);
      if(i>=0)S.players[i]={...S.players[i],...rec};else S.players.push({id:'p'+Date.now(),...rec});
      S.players.sort((a,b)=>a.name.localeCompare(b.name,'ar'));persistDemo();return;
    }
    const {fs,db}=await fbInit();const ex=S.players.find(x=>x.name===p.name);
    if(ex&&ex.id){await withTimeout(fs.updateDoc(fs.doc(db,'players',ex.id),{imageUrl:rec.img}));ex.img=rec.img}
    else{const r=await withTimeout(fs.addDoc(fs.collection(db,'players'),{name:rec.name,imageUrl:rec.img}));S.players.push({id:r.id,...rec});S.players.sort((a,b)=>a.name.localeCompare(b.name,'ar'))}
  },
  async deletePlayer(name){
    const ex=S.players.find(x=>x.name===name);if(!ex)return;
    if(S.mode==='live'&&ex.id){const {fs,db}=await fbInit();await withTimeout(fs.deleteDoc(fs.doc(db,'players',ex.id)))}
    S.players=S.players.filter(x=>x.name!==name);if(S.mode==='demo')persistDemo();
  },
  async saveMeta(m){
    S.meta=clone(m);
    if(S.mode==='demo'){persistDemo();return}
    const {fs,db}=await fbInit();await withTimeout(fs.setDoc(fs.doc(db,'v2_meta','state'),clone(m)));
  }
};

/* ---------- محرك الإحصائيات ---------- */
const bump=(map,k,w,l)=>{const o=map[k]||(map[k]={w:0,l:0,m:0});o.w+=w;o.l+=l;o.m++};
function computeSeason(sn){
  const P={},D={};let kims=0,nightsN=0;
  const mk=name=>P[name]||(P[name]={name,w:0,l:0,nights:new Set(),partners:{},opps:{},log:[]});
  if(sn===1){
    S.legacy.forEach(r=>{const o=mk(r.name);o.w+=r.win;o.l+=r.loss;o.nights.add(r.date)});
    kims=Math.round(Object.values(P).reduce((a,p)=>a+p.w,0)/2);
    nightsN=new Set(S.legacy.map(r=>r.date)).size;
  }
  {
    S.nights.filter(n=>seasonOf(n.date)===sn).forEach(n=>{
      nightsN++;
      n.matches.forEach(m=>{
        kims+=m.sa+m.sb;
        [[m.a,m.b,m.sa,m.sb],[m.b,m.a,m.sb,m.sa]].forEach(([team,opp,won,lost])=>{
          const key=[...team].sort().join('|');
          const d=D[key]||(D[key]={players:[...team].sort(),w:0,l:0,m:0});d.w+=won;d.l+=lost;d.m++;
          team.forEach(p=>{
            const o=mk(p);o.w+=won;o.l+=lost;o.nights.add(n.date);
            const mate=team.find(x=>x!==p);
            bump(o.partners,mate,won,lost);
            opp.forEach(q=>bump(o.opps,q,won,lost));
            o.log.push({date:n.date,mate,opp,won,lost});
          });
        });
      });
    });
  }
  const rows=Object.values(P).map(p=>({name:p.name,w:p.w,l:p.l,games:p.w+p.l,net:p.w-p.l,wr:p.w+p.l?p.w/(p.w+p.l):0,nights:p.nights.size}))
    .sort((a,b)=>b.net-a.net||b.wr-a.wr||a.name.localeCompare(b.name,'ar'));
  const duos=Object.values(D).map(d=>({...d,games:d.w+d.l,wr:d.w+d.l?d.w/(d.w+d.l):0}));
  return{rows,P,duos,kims,nights:nightsN};
}
function tally(matches){
  const T={};
  matches.forEach(m=>{[[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]].forEach(([team,won,lost])=>team.forEach(p=>{const o=T[p]||(T[p]={name:p,w:0,l:0});o.w+=won;o.l+=lost}))});
  return Object.values(T).map(o=>({...o,net:o.w-o.l})).sort((a,b)=>b.net-a.net||a.name.localeCompare(b.name,'ar'));
}
const seasonOf=d=>Math.max(1,(+String(d).slice(0,4)||2026)-2025);   // 2026 = الموسم 1، 2027 = الموسم 2 ...
const nowSeason=()=>seasonOf(today());
function champions(){
  return seasonList().filter(n=>n<nowSeason()).map(n=>{const r=computeSeason(n).rows[0];return r?{season:n,name:r.name,net:r.net,w:r.w,l:r.l}:null}).filter(Boolean);
}
const seasonList=()=>{
  const s=new Set([nowSeason()]);
  S.nights.forEach(n=>s.add(seasonOf(n.date)));
  if(S.legacy.length)s.add(1);
  return [...s].sort((a,b)=>b-a);
};
const seasonLabel=n=>'الموسم '+n+' · '+(2025+n);
const curSeason=()=>S.viewSeason??nowSeason();
const allNames=()=>{
  const s=new Set(S.players.map(p=>p.name));
  S.nights.forEach(n=>n.matches.forEach(m=>[...m.a,...m.b].forEach(x=>s.add(x))));
  S.legacy.forEach(r=>s.add(r.name));
  return [...s].sort((a,b)=>a.localeCompare(b,'ar'));
};

/* ---------- مكونات صغيرة ---------- */
function avatar(name,size=36){
  const p=S.players.find(x=>x.name===name);
  const img=p&&p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
  return `<span class="av" style="--s:${size}px">${img}</span>`;
}
const pair=(team,size=30)=>`<span class="pair">${team.map(n=>avatar(n,size)).join('')}</span>`;
function toast(msg,err=false){
  const t=$('#toast');t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},2800);
}
function bar(p,low){return `<div class="bar"><i class="${low?'low':''}" style="width:${p}%"></i></div>`}

/* ---------- المسودة (الليلة قيد الإدخال) ---------- */
const newDraft=()=>({id:null,date:today(),season:null,attendees:[],matches:[]});
const saveDraft=()=>LS.set('dl2_draft_'+S.mode,S.draft);

/* =====================================================================
   الشاشات
   ===================================================================== */
function render(){
  $('#modeChip').textContent=S.mode==='live'?'مباشر':'تجريبي';
  $('#seasonChip').textContent='الموسم '+nowSeason();
  $('#banner').innerHTML=S.error?`<div class="banner">${esc(S.error)}</div>`:'';
  const key=S.page==='player'?'players':S.page;
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.page===key?'page':'false'));
  const v=$('#view');
  if(!S.ready){v.innerHTML='<div class="loading">جاري التحميل…</div>';return}
  const fn={standings:rStandings,stats:rStats,players:rPlayers,draw:rDraw,admin:rAdmin,player:rPlayer}[S.page]||rStandings;
  v.innerHTML=fn();
  if(SH)renderSheet();
}
function go(page,opts={}){
  if(page!=='admin')closeSheetIf();
  if(page==='player'){S.backTo=S.page==='player'?S.backTo:S.page}
  S.page=page;Object.assign(S,opts);window.scrollTo(0,0);render();
}

/* ----- الترتيب ----- */
function seasonPills(){
  const list=seasonList();if(list.length<2)return '';
  const sn=curSeason();
  return `<div class="pills" role="group" aria-label="الموسم">${list.map(n=>`<button class="pill" data-act="season" data-s="${n}" aria-pressed="${n===sn}">${seasonLabel(n)}</button>`).join('')}</div>`;
}
function podium(rows,sn){
  const order=[1,0,2].filter(i=>rows[i]);   // وسط = الأول، يمين الشاشة = الثالث
  const cols=order.map(i=>{const r=rows[i],k=i+1;
    return `<button class="pod p${k}" data-act="player" data-name="${esc(r.name)}" aria-label="المركز ${k}: ${esc(r.name)}">
      <div class="who">${k===1?`<span class="crownI">${CROWN}</span>`:''}${avatar(r.name,k===1?104:76)}
      <div class="nm">${esc(r.name)}</div><div class="st">${r.w} فوز · ${r.l} خسارة</div></div>
      <div class="block"><span class="rk">${k}</span><span class="nt ${r.net>0?'pos':r.net<0?'neg':''}">${signed(r.net)}</span></div></button>`}).join('');
  return `<div class="podium">${cols}</div><div class="floor"></div>`;
}
function rStandings(){
  const sn=curSeason(),T=computeSeason(sn),rows=T.rows,champs=champions();

/* ----- إحصاءات ----- */
function nightsSummary(sn){
  const out=[];
  if(sn===1){
    const by={};S.legacy.forEach(r=>{(by[r.date]||(by[r.date]=[])).push({name:r.name,w:r.win,l:r.loss,net:r.win-r.loss})});
    Object.entries(by).forEach(([date,a])=>{a.sort((x,y)=>y.net-x.net);out.push({date,top:a[0],n:a.length,kims:Math.round(a.reduce((t,x)=>t+x.w,0)/2)})});
  }
  S.nights.filter(n=>seasonOf(n.date)===sn).forEach(n=>{const t=tally(n.matches);out.push({date:n.date,top:t[0],n:t.length,kims:n.matches.reduce((a,m)=>a+m.sa+m.sb,0)})});
  return out.sort((a,b)=>a.date<b.date?1:-1);
}

/* ----- القرعة ----- */
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const keyOf=(x,y)=>[x,y].sort().join('|');
function pickRound(att,rounds){
  // سجل اللقاءات: ليالي سابقة (الأقدم أولاً) ثم جولات القرعة الحالية
  const ev=[];S.nights.forEach(n=>n.matches.forEach(m=>ev.push({a:m.a,b:m.b})));
  rounds.forEach(r=>ev.push({a:r.a,b:r.b}));
  const partner={},opp={};   // {count, w: ثقل الحداثة}
  const add=(o,k,age)=>{const e=o[k]||(o[k]={c:0,w:0});e.c++;e.w+=1/age};
  ev.forEach((r,i)=>{const age=ev.length-i;   // 1 = الأحدث
    add(partner,keyOf(...r.a),age);add(partner,keyOf(...r.b),age);
    r.a.forEach(x=>r.b.forEach(y=>add(opp,keyOf(x,y),age)))});
  const plays={};att.forEach(n=>plays[n]=0);
  rounds.forEach(r=>[...r.a,...r.b].forEach(n=>{if(n in plays)plays[n]++}));
  // من يلعب: الأقل لعباً الليلة أولاً، والتعادل بالسحب العشوائي
  const four=shuffle(att).sort((x,y)=>plays[x]-plays[y]).slice(0,4);
  const rest=att.filter(n=>!four.includes(n));
  const [p,q,r,t]=four;
  const opts=[[[p,q],[r,t]],[[p,r],[q,t]],[[p,t],[q,r]]];
  const pen=(o,k,wc,ww)=>o[k]?o[k].c*wc+o[k].w*ww:0;
  const scored=opts.map(([a,b])=>{
    let sc=pen(partner,keyOf(...a),6,40)+pen(partner,keyOf(...b),6,40);   // تكرار الشريك: الأشد، والأحدث أسوأ
    a.forEach(x=>b.forEach(y=>sc+=pen(opp,keyOf(x,y),1,6)));               // تكرار الخصم: أخف
    return{a,b,sc,j:Math.random()*0.5}}).sort((x,y)=>(x.sc+x.j)-(y.sc+y.j));
  const best=scored[0],swap=rnd(2)===1;
  return{a:shuffle(swap?best.b:best.a),b:shuffle(swap?best.a:best.b),rest};
}

  if(cur){

  }

    <button class="btn primary bigdraw" data-act="draw-go" ${ok&&!busy?'':'disabled'}>${svg('<path d="M4 4l5 5M20 4l-5 5M4 20l5-5M20 20l-5-5M12 8v8M8 12h8"/>',24,2.4)}${rounds.length?'اسحب الجولة التالية':'اسحب القرعة'}</button>
    ${!ok?`<div class="hint" style="text-align:center;color:var(--coral)">يلزم 4 لاعبين على الأقل.</div>`:''}
    ${rounds.length&&!busy?`<button class="btn ghost" data-act="draw-record" data-i="${rounds.length-1}">سجّل نتيجة هذه المواجهة</button>`:''}</div>`;
  if(rounds.length>1||(rounds.length===1&&busy)){
    h+=`<div class="sec"><div class="sec-h"><h2>جولات الليلة</h2><span class="sub">${rounds.length}</span></div><div class="list">`+

  }
  if(rounds.length)h+=`<button class="btn ghost" data-act="draw-reset" style="margin-top:18px">بدء قرعة جديدة لليلة جديدة</button>`;
  return h;
}

/* ----- الليلة (إدخال المواجهات) ----- */
function matchCard(m,i){
  const aw=m.sa>m.sb,bw=m.sb>m.sa;
  const side=(t,s,w)=>`<div class="side ${w?'win':''}"><div class="who">${pair(t)}<span class="names">${esc(t.join(' + '))}</span></div><div class="score n">${s}</div></div>`;
  return `<div class="mcard"><div class="mhead"><span class="t">المواجهة ${i+1}</span><span><button class="icon" data-act="edit-match" data-i="${i}" aria-label="تعديل المواجهة ${i+1}">${IC.edit}</button><button class="icon" data-act="del-match" data-i="${i}" aria-label="حذف المواجهة ${i+1}">${IC.trash}</button></span></div>${side(m.a,m.sa,aw)}${side(m.b,m.sb,bw)}</div>`;

    av(r.name,925,y+41,30,{c:'#2C3C5C',w:3});
    T(r.name,880,y+54,'800 36px '+F,'#F4F6FA','right');
    T(r.w+' - '+r.l,420,y+54,'700 30px '+N,'#8B95A7','center');
    T((r.net>0?'+':'')+r.net,110,y+57,'800 46px '+N,r.net>0?'#C6FF3D':r.net<0?'#FF6B7A':'#F4F6FA','left');
  });
  T(new Date().toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}),W/2,H-50,'600 26px '+F,'#8B95A7');
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('تعذّر إنشاء الصورة')),'image/png'));
}

/* =====================================================================
   الأحداث
   ===================================================================== */
const A={
  nav(t,e){e.preventDefault();go(t.dataset.page)},
  settings(){go('admin')},
  'sheet-close'(){closeSheet()},
  season(t){S.viewSeason=+t.dataset.s;render()},
  player(t){S.viewPlayer=t.dataset.name;go('player')},
  back(){go(S.backTo||'standings')},

  'toggle-att'(t){
    if(S.draw.busy)return;
    const n=t.dataset.name,a=S.draft.attendees,i=a.indexOf(n);
    if(i>-1)a.splice(i,1);else a.push(n);
    saveDraft();render();
  },
  async 'share-img'(){
    toast('جاري تجهيز الصورة…');
    try{const blob=await buildStandingsImage(curSeason());
      openSheet({type:'share',blob,url:URL.createObjectURL(blob),sn:curSeason()})}
    catch(err){console.error(err);toast('تعذّر إنشاء الصورة: '+(err.message||err),true)}
  },
  async 'img-share'(){
    const file=new File([SH.blob],'ترتيب-الدومنة.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'ترتيب دوري الدومنة'});
      else{A['img-save']();toast('المتصفح لا يدعم المشاركة المباشرة، حُفظت الصورة')}
    }catch(err){if(err.name!=='AbortError')toast('تعذّرت المشاركة: '+err.message,true)}
  },
  'img-save'(){const a=document.createElement('a');a.href=SH.url;a.download='ترتيب-الدومنة-'+today()+'.png';a.click()},
  'att-clear'(){if(S.draw.busy)return;S.draft.attendees=[];saveDraft();render()},
  'add-match'(){openSheet({type:'match',i:null,a0:'',a1:'',b0:'',b1:'',sa:0,sb:0})},
  'edit-match'(t){const i=+t.dataset.i,m=S.draft.matches[i];openSheet({type:'match',i,a0:m.a[0],a1:m.a[1],b0:m.b[0],b1:m.b[1],sa:m.sa,sb:m.sb})},
  'del-match'(t){
    const i=+t.dataset.i;if(!confirm('حذف المواجهة '+(i+1)+'؟'))return;
    S.draft.matches.splice(i,1);saveDraft();render();
  },
  step(t){const k='s'+t.dataset.side;SH[k]=Math.max(0,Math.min(99,SH[k]+(+t.dataset.d)));renderSheet()},
  'copy-last'(){const m=S.draft.matches[S.draft.matches.length-1];Object.assign(SH,{a0:m.a[0],a1:m.a[1],b0:m.b[0],b1:m.b[1],sa:0,sb:0});renderSheet()},
  'match-save'(){
    const p=[SH.a0,SH.a1,SH.b0,SH.b1];
    if(p.some(x=>!x))return toast('اختر اللاعبين الأربعة',true);
    if(new Set(p).size<4)return toast('لا يمكن تكرار لاعب في المواجهة',true);
    if(SH.sa+SH.sb===0)return toast('أدخل نتيجة المواجهة',true);
    const m={a:[SH.a0,SH.a1],b:[SH.b0,SH.b1],sa:SH.sa,sb:SH.sb};
    if(SH.i==null)S.draft.matches.push(m);else S.draft.matches[SH.i]=m;
    p.forEach(n=>{if(!S.draft.attendees.includes(n))S.draft.attendees.push(n)});
    if(SH.round!=null&&S.draw.rounds[SH.round]){S.draw.rounds[SH.round].done=true;saveDraw();toast('أُضيفت إلى ليلة التسجيل ✓')}
    saveDraft();closeSheet();render();
  },
  async 'save-night'(){
    const d=S.draft;
    if(!d.matches.length)return toast('أضف مواجهة واحدة على الأقل',true);
    if(!d.date)return toast('اختر تاريخ الليلة',true);
    const season=seasonOf(d.date);
    const dup=S.nights.find(n=>n.date===d.date&&seasonOf(n.date)===season&&n.id!==d.id);
    if(dup&&!confirm('توجد ليلة مسجّلة بنفس التاريخ. هل تريد حفظ هذه كليلة إضافية؟'))return;
    const players=[...new Set([...d.attendees,...d.matches.flatMap(m=>[...m.a,...m.b])])];
    try{
      await Data.saveNight({id:d.id,date:d.date,season,players,matches:d.matches});
      S.draft=newDraft();saveDraft();S.draw={rounds:[],busy:false,pending:null};saveDraw();toast('تم حفظ الليلة ✓');
      S.viewSeason=null;go('standings');
    }catch(err){console.error(err);toast('تعذّر الحفظ: '+(err.code||err.message),true)}
  },
  'clear-draft'(){if(!confirm('مسح المسودة الحالية؟'))return;S.draft=newDraft();saveDraft();render()},
  'cancel-edit'(){S.draft=newDraft();saveDraft();render()},
  'edit-night'(t){
    const n=S.nights.find(x=>x.id===t.dataset.id);if(!n)return;
    S.draft={id:n.id,date:n.date,season:n.season,attendees:[...n.players],matches:clone(n.matches)};
    saveDraft();window.scrollTo(0,0);render();
  },
  async 'del-night'(t){
    const n=S.nights.find(x=>x.id===t.dataset.id);if(!n||!confirm('حذف ليلة '+n.date+' نهائياً؟'))return;
    try{await Data.deleteNight(n.id);if(S.draft.id===n.id){S.draft=newDraft();saveDraft()}toast('تم الحذف');render()}
    catch(err){toast('تعذّر الحذف: '+(err.code||err.message),true)}
  },


  'admin-tab'(t){S.adminTab=t.dataset.t;render()},
  async unlock(){
    const v=($('#pin')||{}).value||'';if(!v)return;
    if(await sha(v)===S.meta.pinHash){S.unlocked=true;render()}else toast('الرمز غير صحيح',true);
  },
  async 'pin-set'(){
    const v=(($('#newpin')||{}).value||'').trim();if(v.length<4)return toast('الرمز 4 أرقام على الأقل',true);
    try{await Data.saveMeta({...S.meta,pinHash:await sha(v)});S.unlocked=true;toast('تم تفعيل الرمز ✓');render()}catch(err){toast('تعذّر الحفظ: '+(err.code||err.message),true)}
  },
  async 'pin-clear'(){
    if(!confirm('إزالة رمز الإدارة؟'))return;
    const m={...S.meta};delete m.pinHash;
    try{await Data.saveMeta(m);toast('أُزيل الرمز');render()}catch(err){toast('تعذّر الحفظ: '+(err.code||err.message),true)}
  },

  'player-new'(){openSheet({type:'player',edit:false,name:'',img:'',busy:false})},
  'player-edit'(t){const n=t.dataset.name,p=S.players.find(x=>x.name===n);openSheet({type:'player',edit:true,name:n,img:p?p.img:'',busy:false})},
  'p-noimg'(){SH.img='';renderSheet()},
  async 'p-save'(){
    if(SH.busy)return;
    const name=(SH.name||'').trim();if(!name)return toast('اكتب اسم اللاعب',true);
    if(!SH.edit&&allNames().includes(name))return toast('اللاعب موجود مسبقاً',true);
    SH.busy=true;renderSheet();
    try{await Data.savePlayer({name,img:SH.img});
      if(!SH.edit&&!S.draft.attendees.includes(name)){S.draft.attendees.push(name);saveDraft()}
      closeSheet();toast('تم الحفظ ✓');render()}
    catch(err){console.error(err);SH.busy=false;renderSheet();toast('تعذّر الحفظ: '+(err.code||err.message),true)}
  },
  async 'p-del'(){
    if(!confirm('حذف اللاعب '+SH.name+'؟'))return;
    try{await Data.deletePlayer(SH.name);S.draft.attendees=S.draft.attendees.filter(x=>x!==SH.name);saveDraft();closeSheet();toast('تم الحذف');render()}
    catch(err){toast('تعذّر الحذف: '+(err.code||err.message),true)}
  },

  async 'draw-go'(){
    const D=S.draw,att=S.draft.attendees;
    if(D.busy||att.length<4)return;
    const res=pickRound(att,D.rounds);
    D.busy=true;D.pending=res;render();
    const slots=[...document.querySelectorAll('[data-slot]')];
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finals=[...res.a,...res.b];
    const tick=setInterval(()=>slots.forEach((el,i)=>{if(!el.dataset.lock)el.textContent=att[rnd(att.length)]}),reduce?9999:70);
    for(let i=0;i<slots.length;i++){
      await new Promise(r=>setTimeout(r,reduce?0:(i===0?900:520)));
      const el=slots[i];el.dataset.lock='1';el.textContent=finals[i];el.classList.add('lockpop');
      if(navigator.vibrate)try{navigator.vibrate(18)}catch{}
    }
    clearInterval(tick);
    await new Promise(r=>setTimeout(r,reduce?0:450));
    D.rounds.push({a:res.a,b:res.b,rest:res.rest,done:false});
    D.busy=false;D.pending=null;saveDraw();render();
  },
  'draw-record'(t){
    const i=+t.dataset.i,r=S.draw.rounds[i];if(!r)return;
    openSheet({type:'match',i:null,round:i,a0:r.a[0],a1:r.a[1],b0:r.b[0],b1:r.b[1],sa:0,sb:0});
  },
  'draw-reset'(){if(!confirm('مسح جولات القرعة الحالية؟'))return;S.draw={rounds:[],busy:false,pending:null};saveDraw();render()},

  async 'fb-test'(){
    S.diag=[[null,'جاري الفحص…']];S.diag.busy=true;render();
    const out=[];
    try{
      const {fs,db}=await fbInit();
      const rd=async(col)=>{try{const q=await withTimeout(fs.getDocs(fs.collection(db,col)));out.push([true,`قراءة ${col}: ${q.size} سجل`])}catch(e){out.push([false,`قراءة ${col}: ${e.code==='permission-denied'?'مرفوض من القواعد':(e.code||e.message)}`])}};
      await rd('players');await rd('game_records');await rd('v2_nights');
      try{await withTimeout(fs.setDoc(fs.doc(db,'v2_meta','ping'),{t:new Date().toISOString()}));out.push([true,'الكتابة في v2_meta: مسموحة'])}
      catch(e){out.push([false,`الكتابة في v2_meta: ${e.code==='permission-denied'?'مرفوضة من القواعد':(e.code||e.message)}`])}
    }catch(e){out.push([false,'تعذّر الاتصال: '+(e.code||e.message)])}
    S.diag=out;render();
  },
  'fb-save'(){
    const txt=($('#fbcfg')||{}).value||'',o={};
    ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{const m=txt.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});
    if(!o.apiKey||!o.projectId||!o.appId)return toast('لم أجد apiKey وprojectId وappId في النص',true);
    LS.set('dl2_fbcfg',o);toast('حُفظ الإعداد. جارٍ إعادة التحميل…');setTimeout(()=>{location.hash='admin';location.reload()},700);
  },
  'fb-reset'(){try{localStorage.removeItem('dl2_fbcfg')}catch{}toast('عدنا للإعداد الافتراضي');setTimeout(()=>{location.hash='admin';location.reload()},600)},

  'set-mode'(t){
    const m=t.dataset.mode;if(m===S.mode)return;
    LS.set('dl2_mode',m);location.hash='admin';location.reload();
  },
  export(){
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),meta:S.meta,nights:S.nights},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='domino-league-'+today()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  'reset-demo'(){if(!confirm('إعادة البيانات التجريبية إلى حالتها الأولى؟'))return;localStorage.removeItem('dl2_demo');localStorage.removeItem('dl2_draft_demo');localStorage.removeItem('dl2_draw_demo');location.reload()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target,on=t.dataset&&t.dataset.on;
  if(on==='date'){S.draft.date=t.value;saveDraft();render()}
  else if(on==='sel'&&SH){SH[t.dataset.k]=t.value;renderSheet()}
  else if(on==='purl'&&SH){SH.img=t.value.trim();renderSheet()}
  else if(on==='pfile'&&SH&&t.files&&t.files[0]){
    resizeImg(t.files[0]).then(u=>{SH.img=u;renderSheet()}).catch(err=>toast(err.message,true));
  }
});
document.addEventListener('input',e=>{
  const t=e.target,on=t.dataset&&t.dataset.on;
  if(on==='pname'&&SH)SH.name=t.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});

/* ---------- الإقلاع ---------- */
async function boot(){
  const d=LS.get('dl2_draft_'+S.mode,null);
  S.draft=d&&Array.isArray(d.matches)&&Array.isArray(d.attendees)?d:newDraft();
  const h=location.hash.replace('#','');if(['standings','stats','players','draw','admin'].includes(h))S.page=h;
  render();
  try{
    if(S.mode==='live')await loadLive();else loadDemo();
  }catch(err){
    console.error(err);
    S.error='تعذّر الاتصال بقاعدة البيانات ('+(err.code||err.message)+'). عدنا إلى الوضع التجريبي. تأكد من قواعد Firestore ثم جرّب الوضع المباشر من الإعدادات.';
    unsubs.forEach(u=>{try{u()}catch{}});unsubs=[];
    S.mode='demo';loadDemo();   // لجلسة واحدة فقط، لا نحفظ التحويل حتى لا يعلق الزائر في التجريبي
  }
  // تنظيف: أي اسم غير موجود في البيانات الحالية يُزال من المسودة والقرعة
  const known=new Set(allNames());
  S.draft.attendees=S.draft.attendees.filter(n=>known.has(n));
  S.draft.matches=S.draft.matches.filter(m=>[...m.a,...m.b].every(n=>known.has(n)));
  S.draw.rounds=(S.draw.rounds||[]).filter(r=>[...r.a,...r.b].every(n=>known.has(n)));
  S.draw.busy=false;S.draw.pending=null;saveDraft();saveDraw();
  S.ready=true;render();
}
boot();
